# Where start points are sampled from. Boxes are [west, south, east, north].
# Areas are cities and towns rather than whole countries: listing every coverage
# tile of a country would take days and use up the daily tile allowance.
countries:
  - code: IN
    name: India
    bbox: [68.1, 6.7, 97.4, 35.7]
    areas:
      - { name: Bengaluru, bbox: [77.50, 12.90, 77.68, 13.05] }
      - { name: Delhi, bbox: [77.05, 28.50, 77.30, 28.75] }
      - { name: Mumbai, bbox: [72.80, 18.90, 72.95, 19.15] }
      - { name: Chennai, bbox: [80.18, 12.95, 80.30, 13.15] }
      - { name: Kolkata, bbox: [88.30, 22.50, 88.42, 22.65] }
  - code: US
    name: United States
    bbox: [-125.0, 24.5, -66.9, 49.4]
    areas:
      - { name: Seattle, bbox: [-122.40, 47.55, -122.25, 47.70] }
      - { name: Denver, bbox: [-105.05, 39.65, -104.88, 39.80] }
      - { name: Austin, bbox: [-97.80, 30.20, -97.65, 30.35] }
      - { name: Washington, bbox: [-77.10, 38.85, -76.95, 38.98] }
  - code: BR
    name: Brazil
    bbox: [-74.0, -33.8, -34.8, 5.3]
    areas:
      - { name: São Paulo, bbox: [-46.75, -23.65, -46.55, -23.50] }
      - { name: Rio de Janeiro, bbox: [-43.30, -22.98, -43.15, -22.85] }
      - { name: Curitiba, bbox: [-49.33, -25.50, -49.22, -25.38] }
      - { name: Belo Horizonte, bbox: [-44.00, -19.98, -43.90, -19.85] }
  - code: RU
    name: Russia
    bbox: [19.6, 41.2, 180.0, 81.9]
    areas:
      - { name: Moscow, bbox: [37.50, 55.70, 37.72, 55.80] }
      - { name: Saint Petersburg, bbox: [30.25, 59.88, 30.40, 59.98] }
      - { name: Kazan, bbox: [49.05, 55.75, 49.20, 55.83] }
      - { name: Yekaterinburg, bbox: [60.55, 56.80, 60.68, 56.88] }
  - code: FR
    name: France
    bbox: [-5.2, 41.3, 9.6, 51.1]
    areas:
      - { name: Paris, bbox: [2.28, 48.82, 2.40, 48.90] }
      - { name: Lyon, bbox: [4.80, 45.72, 4.90, 45.79] }
      - { name: Toulouse, bbox: [1.40, 43.57, 1.48, 43.64] }
      - { name: Rennes, bbox: [-1.72, 48.08, -1.62, 48.14] }

# Areas the detect and export commands analyse. Each image is downloaded at
# 2048 px and run through the detectors, so areas stay small and capped.
analysis:
  # Country roads in Burgundy lined with white bollards.
  - { name: saulieu, country: FR, bbox: [4.18, 47.25, 4.32, 47.35], limit: 200 }
