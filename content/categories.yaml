# Clue categories. Every clue file names one of these ids in its `category` field.
#
#   id:             kebab-case, used in folder names and shards
#   label:          shown in the UI
#   detector:
#     mapillary:    Mapillary class values that map to this category
#     owl:          OWLv2 text prompts, and the score threshold for this category
#   negatives:      look-alikes that are not clues, for the matcher's "none of these"
#   overlay_colour: outline colour in the viewer
#   scene:          true for whole-scene clues (soil, vegetation), false for objects
#
# Mapillary values are the ones seen in real /detections responses (checked
# 2026-11-24 on 40 images across the five countries).
#
# OWLv2 thresholds: at 0.2 the detector returned mostly look-alikes (concrete
# blocks, painted tree trunks, striped barriers), so each category starts higher
# and gets tuned with the eval script.

- id: bollard
  label: Bollard
  detector:
    owl:
      # Tested on Burgundy roads: generic bollard prompts mostly found sign posts.
      # Other countries' bollards will need their own prompts once tested.
      prompts: ["a white roadside bollard post"]
      threshold: 0.4
  negatives: ["a road sign on a metal pole", "a wooden fence post", "a tree trunk", "a concrete block"]
  overlay_colour: "#f59e0b"
  scene: false

- id: utility-pole
  label: Utility pole
  detector:
    mapillary: [object--support--utility-pole]
    owl:
      prompts: ["a utility pole"]
      threshold: 0.3
  negatives: ["a tree trunk", "a street light pole", "a road sign on a metal pole"]
  overlay_colour: "#38bdf8"
  scene: false

- id: kilometre-marker
  label: Kilometre marker
  detector:
    owl:
      # "a small distance marker post" was dropped: it matched bollards. Real French
      # markers scored 0.45-0.64; the best look-alike scored 0.40.
      prompts: ["a roadside milestone", "a kilometre marker stone"]
      threshold: 0.42
  negatives: ["a road sign on a metal pole", "a concrete block", "a rock"]
  overlay_colour: "#f472b6"
  scene: false

- id: street-light
  label: Street light
  detector:
    mapillary: [object--street-light]
  negatives: ["a traffic light", "a road sign"]
  overlay_colour: "#a3e635"
  scene: false

- id: sign-back
  label: Sign back
  detector:
    mapillary: [object--traffic-sign--back, object--traffic-sign--direction-back]
  negatives: ["the front of a road sign", "an advertising board"]
  overlay_colour: "#c084fc"
  scene: false
