    strength: typical
lookalikes: [in-milestone-green-top, fr-kilometre-marker-yellow-top]
tell_apart: "Check the colour of the top: yellow for National Highways, green for State Highways. French departmental markers also have yellow tops, but they show only a road number starting with D, with no place name or distance on the body."
